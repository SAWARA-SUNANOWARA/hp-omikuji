<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>睡眠記録</title>
  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest-sleep.json">
  <meta name="apple-mobile-web-app-title" content="睡眠記録">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#eef1fb">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #eef1fb;
      font-family: "Helvetica Neue", "Yu Gothic", "YuGothic", sans-serif;
      color: #333;
    }

    body {
      min-height: 100vh;
    }

    .screen {
      display: none;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 18px 110px;
    }

    .screen.active {
      display: block;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: #6c7ae0;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    .top-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #444;
      letter-spacing: 0.05em;
    }

    /* ホーム画面 */
    .home-header {
      text-align: center;
      margin: 24px 0 36px;
    }

    .home-header h1 {
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      color: #444;
      margin-bottom: 6px;
    }

    .home-header p {
      font-size: 0.85rem;
      color: #999;
    }

    .home-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 20px;
      margin-bottom: 16px;
      border: none;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(70, 80, 150, 0.08);
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .home-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .home-btn .icon {
      font-size: 1.8rem;
    }

    .home-btn .label {
      font-size: 1.05rem;
      font-weight: bold;
      color: #444;
    }

    .home-btn .sub {
      font-size: 0.75rem;
      color: #999;
      margin-top: 2px;
    }

    .home-btn.night { background: #6c7ae0; }
    .home-btn.night .label, .home-btn.night .sub { color: #fff; }
    .home-btn.night .sub { color: #dfe2fa; }

    .home-btn.morning { background: #ffb35c; }
    .home-btn.morning .label, .home-btn.morning .sub { color: #fff; }
    .home-btn.morning .sub { color: #fff3e2; }

    /* フォーム共通 */
    .badge {
      display: inline-block;
      background: #dfe2fa;
      color: #4650a0;
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 4px;
    }

    .date-label {
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 22px;
    }

    .field-label {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 8px;
    }

    .seg-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .seg-btn {
      flex: 1;
      min-width: 64px;
      padding: 12px 8px;
      border-radius: 10px;
      border: 1px solid #d6d9ef;
      background: #fff;
      color: #555;
      font-size: 0.9rem;
      text-align: center;
      cursor: pointer;
    }

    .seg-btn.selected {
      background: #6c7ae0;
      border-color: #6c7ae0;
      color: #fff;
      font-weight: bold;
    }

    .rating-row {
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }

    .rating-btn {
      flex: 1;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid #d6d9ef;
      background: #fff;
      color: #555;
      font-size: 1rem;
      cursor: pointer;
    }

    .rating-btn.selected {
      background: #6c7ae0;
      border-color: #6c7ae0;
      color: #fff;
      font-weight: bold;
    }

    .range-time-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: #6c7ae0;
      text-align: center;
      margin-bottom: 8px;
    }

    .range-time-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
      height: 36px;
      accent-color: #6c7ae0;
    }

    .range-time-scale {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #aaa;
      margin-top: 4px;
    }

    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .stamp-btn {
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1px solid #d6d9ef;
      background: #fff;
      color: #666;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .stamp-btn.selected {
      background: #b98a4e;
      border-color: #b98a4e;
      color: #fff;
      font-weight: bold;
    }

    input[type="time"] {
      flex: 1;
      font-size: 1rem;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d6d9ef;
      background: #fff;
      color: #333;
    }

    input[type="time"]:disabled {
      background: #f0f1f8;
      color: #bbb;
    }

    .clear-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #d6d9ef;
      background: #fff;
      color: #999;
      font-size: 1rem;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .save-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 18px 22px;
      background: linear-gradient(to top, #eef1fb 60%, rgba(238,241,251,0));
    }

    .save-btn {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #6c7ae0;
      color: #fff;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 一覧画面 */
    .list-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: none;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(70, 80, 150, 0.08);
      cursor: pointer;
      text-align: left;
    }

    .list-date {
      font-size: 0.85rem;
      font-weight: bold;
      color: #6c7ae0;
    }

    .list-summary {
      font-size: 0.85rem;
      color: #555;
    }

    .list-refreshed {
      font-size: 0.75rem;
      color: #999;
    }

    .empty-msg {
      text-align: center;
      color: #aaa;
      font-size: 0.9rem;
      margin-top: 40px;
    }

    /* 詳細画面 */
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e3e5f5;
      font-size: 0.9rem;
    }

    .detail-row .k {
      color: #999;
    }

    .detail-row .v {
      color: #333;
      font-weight: bold;
    }

    .delete-btn {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #fdeeee;
      color: #d24545;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* 中途覚醒(詳細画面) */
    .awakening-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }

    .awakening-time {
      font-size: 0.9rem;
      color: #333;
    }

    .awakening-add {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    /* ホーム画面のトースト通知 */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%) translateY(10px);
      background: #444;
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- ホーム画面 -->
  <div class="screen active" id="screen-home">
    <div class="home-header">
      <h1>睡眠記録</h1>
      <p>タップだけで記録できます</p>
    </div>

    <button class="home-btn night" onclick="openNightScreen()">
      <span class="icon">🌙</span>
      <span>
        <div class="label">就寝を記録</div>
        <div class="sub">寝る前にタップ (約10秒)</div>
      </span>
    </button>

    <button class="home-btn morning" onclick="openMorningScreen()">
      <span class="icon">☀️</span>
      <span>
        <div class="label">起床を記録</div>
        <div class="sub">起きたらタップ (約20秒)</div>
      </span>
    </button>

    <button class="home-btn" style="background:#fff;" onclick="openCaffeineScreen()">
      <span class="icon">☕</span>
      <span>
        <div class="label" style="color:#444;">カフェインを記録</div>
        <div class="sub" style="color:#999;">飲んだ時間帯をタップ (いつでもOK)</div>
      </span>
    </button>

    <button class="home-btn" style="background:#fff;" onclick="recordAwakening()">
      <span class="icon">🌛</span>
      <span>
        <div class="label" style="color:#444;">中途覚醒を記録</div>
        <div class="sub" style="color:#999;">夜中に目が覚めたらタップ (1秒)</div>
      </span>
    </button>

    <button class="home-btn" style="background:#fff;" onclick="openListScreen()">
      <span class="icon">📋</span>
      <span>
        <div class="label" style="color:#444;">記録一覧</div>
        <div class="sub" style="color:#999;">これまでの記録を見る</div>
      </span>
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 夜の記録画面 -->
  <div class="screen" id="screen-night">
    <div class="top-bar">
      <button class="back-btn" onclick="showScreen('screen-home')">‹</button>
      <div class="top-title">就寝の記録</div>
    </div>
    <div class="badge" id="night-bedtime-display"></div>
    <div class="date-label" id="night-date-label"></div>

    <div id="night-fields"></div>

    <div class="save-bar">
      <button class="save-btn" onclick="saveNight()">保存する</button>
    </div>
  </div>

  <!-- 朝の記録画面 -->
  <div class="screen" id="screen-morning">
    <div class="top-bar">
      <button class="back-btn" onclick="showScreen('screen-home')">‹</button>
      <div class="top-title">起床の記録</div>
    </div>
    <div class="badge" id="morning-wake-display"></div>
    <div class="date-label" id="morning-date-label"></div>

    <div id="morning-fields"></div>

    <div class="save-bar">
      <button class="save-btn" onclick="saveMorning()">保存する</button>
    </div>
  </div>

  <!-- カフェイン記録画面 -->
  <div class="screen" id="screen-caffeine">
    <div class="top-bar">
      <button class="back-btn" onclick="showScreen('screen-home')">‹</button>
      <div class="top-title">カフェイン記録</div>
    </div>
    <div class="date-label" id="caffeine-date-label"></div>
    <div class="field-label">飲んだ時間帯をタップ(何回でもOK、押すたびに保存)</div>
    <div class="stamp-grid" id="caffeine-grid"></div>
  </div>

  <!-- 一覧画面 -->
  <div class="screen" id="screen-list">
    <div class="top-bar">
      <button class="back-btn" onclick="showScreen('screen-home')">‹</button>
      <div class="top-title">記録一覧</div>
    </div>
    <div id="list-items"></div>
  </div>

  <!-- 詳細画面 -->
  <div class="screen" id="screen-detail">
    <div class="top-bar">
      <button class="back-btn" onclick="openListScreen()">‹</button>
      <div class="top-title" id="detail-date-label"></div>
    </div>
    <div id="detail-fields"></div>
    <button class="delete-btn" onclick="deleteDetailRecord()">この記録を削除</button>
  </div>

  <script>
    const STORAGE_KEY = "sleepLogRecords_v1";

    const PLACE_LABELS = { home: "自宅", partner: "彼女の家", other: "その他" };
    const ALCOHOL_LABELS = { none: "なし", tipsy: "ほろ酔い", drunk: "しっかり酔い", wasted: "酩酊" };

    // ---- 保存データの読み書き ----
    function loadRecords() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function saveRecords(records) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    // ---- 日付・時刻のユーティリティ ----
    function pad2(n) {
      return String(n).padStart(2, "0");
    }

    function dateKey(d) {
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    }

    function timeStr(d) {
      return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }

    // 就寝時は日付をまたぐため、正午以降にタップした場合は
    // 「翌日の朝に起きる」とみなして起床日をキーにする。
    // 正午より前(日付をまたいで既に朝方)にタップした場合は当日をキーにする。
    function computeNightWakeDateKey(now) {
      const d = new Date(now);
      if (d.getHours() >= 12) {
        d.setDate(d.getDate() + 1);
      }
      return dateKey(d);
    }

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    // ---- 入力パーツ ----
    function makeSegField(labelText, options, value, onChange) {
      const wrap = document.createElement("div");
      wrap.className = "field";
      const label = document.createElement("div");
      label.className = "field-label";
      label.textContent = labelText;
      wrap.appendChild(label);

      const group = document.createElement("div");
      group.className = "seg-group";
      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "seg-btn" + (value === opt.value ? " selected" : "");
        btn.textContent = opt.label;
        btn.onclick = () => onChange(value === opt.value ? null : opt.value);
        group.appendChild(btn);
      });
      wrap.appendChild(group);
      return wrap;
    }

    function makeRatingField(labelText, value, onChange) {
      const wrap = document.createElement("div");
      wrap.className = "field";
      const label = document.createElement("div");
      label.className = "field-label";
      label.textContent = labelText;
      wrap.appendChild(label);

      const row = document.createElement("div");
      row.className = "rating-row";
      for (let i = 1; i <= 5; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "rating-btn" + (value === i ? " selected" : "");
        btn.textContent = String(i);
        btn.onclick = () => onChange(value === i ? null : i);
        row.appendChild(btn);
      }
      wrap.appendChild(row);
      return wrap;
    }

    // スライダー(シークバー)による時刻選択。ホイールが苦手なため、
    // 「朝(5:00〜11:00)」「夜(20:00〜翌4:00)」など想定される範囲に絞って
    // 短いスライダーで選べるようにする。opts: { startHour, totalSteps, stepMinutes }
    function timeIndexToStr(startHour, index, stepMinutes) {
      const totalMinutes = (startHour * 60 + index * stepMinutes + 1440) % 1440;
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      return pad2(h) + ":" + pad2(m);
    }

    function timeStrToIndex(value, startHour, stepMinutes, totalSteps) {
      const [h, m] = value.split(":").map(Number);
      let diff = (h * 60 + m) - startHour * 60;
      diff = ((diff % 1440) + 1440) % 1440;
      const idx = Math.round(diff / stepMinutes);
      if (idx < 0 || idx > totalSteps) return null;
      return idx;
    }

    function makeRangeTimeField(labelText, value, onChange, opts) {
      const wrap = document.createElement("div");
      wrap.className = "field";

      const label = document.createElement("div");
      label.className = "field-label";
      label.textContent = labelText;
      wrap.appendChild(label);

      const valueDisplay = document.createElement("div");
      valueDisplay.className = "range-time-value";
      valueDisplay.textContent = value || "未設定(スライドして設定)";
      wrap.appendChild(valueDisplay);

      const row = document.createElement("div");
      row.className = "range-time-row";

      const slider = document.createElement("input");
      slider.type = "range";
      slider.min = "0";
      slider.max = String(opts.totalSteps);
      slider.step = "1";
      const defaultIndex = Math.floor(opts.totalSteps / 2);
      const restoredIndex = value ? timeStrToIndex(value, opts.startHour, opts.stepMinutes, opts.totalSteps) : null;
      slider.value = String(restoredIndex != null ? restoredIndex : defaultIndex);
      slider.oninput = () => {
        const idx = parseInt(slider.value, 10);
        const t = timeIndexToStr(opts.startHour, idx, opts.stepMinutes);
        valueDisplay.textContent = t;
        onChange(t);
      };
      row.appendChild(slider);

      const clearBtn = document.createElement("button");
      clearBtn.type = "button";
      clearBtn.className = "clear-btn";
      clearBtn.textContent = "×";
      clearBtn.setAttribute("aria-label", "クリア");
      clearBtn.onclick = () => {
        onChange(null);
        valueDisplay.textContent = "未設定(スライドして設定)";
      };
      row.appendChild(clearBtn);

      wrap.appendChild(row);

      const scale = document.createElement("div");
      scale.className = "range-time-scale";
      const startLabel = document.createElement("span");
      startLabel.textContent = timeIndexToStr(opts.startHour, 0, opts.stepMinutes);
      const endLabel = document.createElement("span");
      endLabel.textContent = timeIndexToStr(opts.startHour, opts.totalSteps, opts.stepMinutes);
      scale.appendChild(startLabel);
      scale.appendChild(endLabel);
      wrap.appendChild(scale);

      return wrap;
    }

    // ---- 夜の記録 ----
    let nightDraft = {};
    let nightDateKey = "";

    function openNightScreen() {
      const now = new Date();
      nightDateKey = computeNightWakeDateKey(now);
      const records = loadRecords();
      nightDraft = Object.assign({}, records[nightDateKey] || {});
      nightDraft.bedtime = now.toISOString();

      document.getElementById("night-bedtime-display").textContent =
        "就寝記録: " + timeStr(now) + "(自動記録)";
      document.getElementById("night-date-label").textContent =
        "起床予定日: " + nightDateKey;

      renderNightForm();
      showScreen("screen-night");
    }

    // 夜は「忘れがちなもの」だけに絞る(飲酒)。カフェインは別メニュー、
    // 就寝場所・外出/帰宅時刻・起床時刻は翌朝まとめて記録する。
    function renderNightForm() {
      const root = document.getElementById("night-fields");
      root.innerHTML = "";

      root.appendChild(makeSegField(
        "飲酒",
        [
          { label: "なし", value: "none" },
          { label: "ほろ酔い", value: "tipsy" },
          { label: "しっかり酔い", value: "drunk" },
          { label: "酩酊", value: "wasted" },
        ],
        nightDraft.alcohol_level,
        v => { nightDraft.alcohol_level = v; renderNightForm(); }
      ));

      if (nightDraft.alcohol_level && nightDraft.alcohol_level !== "none") {
        root.appendChild(makeRangeTimeField(
          "最後に飲んだ時刻", nightDraft.alcohol_last_at,
          v => { nightDraft.alcohol_last_at = v; },
          { startHour: 20, totalSteps: 16, stepMinutes: 30 }
        ));
      } else {
        nightDraft.alcohol_last_at = null;
      }
    }

    function saveNight() {
      const records = loadRecords();
      records[nightDateKey] = nightDraft;
      saveRecords(records);
      showScreen("screen-home");
    }

    // ---- 朝の記録 ----
    let morningDraft = {};
    let morningDateKey = "";

    function openMorningScreen() {
      const now = new Date();
      morningDateKey = dateKey(now);
      const records = loadRecords();
      morningDraft = Object.assign({}, records[morningDateKey] || {});
      morningDraft.wake_at = now.toISOString();

      document.getElementById("morning-wake-display").textContent =
        "起床記録: " + timeStr(now) + "(自動記録)";
      document.getElementById("morning-date-label").textContent =
        "記録日: " + morningDateKey;

      renderMorningForm();
      showScreen("screen-morning");
    }

    // 前夜〜今朝にかけての「時刻を覚えていれば十分」な項目は
    // 起床時にまとめて記録する(就寝場所・外出/帰宅時刻)。
    function renderMorningForm() {
      const root = document.getElementById("morning-fields");
      root.innerHTML = "";

      root.appendChild(makeRatingField(
        "すっきり度 (1:だるい → 5:すっきり)", morningDraft.refreshed,
        v => { morningDraft.refreshed = v; renderMorningForm(); }
      ));

      root.appendChild(makeSegField(
        "就寝場所",
        [{ label: "自宅", value: "home" }, { label: "彼女の家", value: "partner" }, { label: "その他", value: "other" }],
        morningDraft.sleep_place,
        v => { morningDraft.sleep_place = v; renderMorningForm(); }
      ));

      root.appendChild(makeRangeTimeField(
        "外出時刻(前日、家を出た時刻)", morningDraft.leave_home_at,
        v => { morningDraft.leave_home_at = v; },
        { startHour: 5, totalSteps: 12, stepMinutes: 30 }
      ));

      root.appendChild(makeRangeTimeField(
        "帰宅時刻(前日)", morningDraft.return_home_at,
        v => { morningDraft.return_home_at = v; },
        { startHour: 20, totalSteps: 16, stepMinutes: 30 }
      ));
    }

    function saveMorning() {
      const records = loadRecords();
      records[morningDateKey] = morningDraft;
      saveRecords(records);
      showScreen("screen-home");
    }

    // ---- 中途覚醒(ホームから1タップで即記録) ----
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function recordAwakening() {
      const now = new Date();
      const key = computeNightWakeDateKey(now);
      const records = loadRecords();
      const rec = Object.assign({}, records[key] || {});
      const awakenings = (rec.awakenings || []).slice();
      awakenings.push({ at: now.toISOString() });
      rec.awakenings = awakenings;
      records[key] = rec;
      saveRecords(records);
      showToast("記録しました " + timeStr(now) + "(今夜" + awakenings.length + "回目)");
    }

    // ---- カフェイン(スタンプカード形式、いつでも追記できる別メニュー) ----
    let caffeineDateKey = "";

    function openCaffeineScreen() {
      caffeineDateKey = computeNightWakeDateKey(new Date());
      document.getElementById("caffeine-date-label").textContent = "記録日: " + caffeineDateKey;
      renderCaffeineGrid();
      showScreen("screen-caffeine");
    }

    function renderCaffeineGrid() {
      const records = loadRecords();
      const rec = records[caffeineDateKey] || {};
      const hours = rec.caffeine_hours || [];

      const grid = document.getElementById("caffeine-grid");
      grid.innerHTML = "";
      for (let h = 0; h < 24; h++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "stamp-btn" + (hours.includes(h) ? " selected" : "");
        btn.textContent = h + "時";
        btn.onclick = () => toggleCaffeineHour(h);
        grid.appendChild(btn);
      }
    }

    function toggleCaffeineHour(h) {
      const records = loadRecords();
      const rec = Object.assign({}, records[caffeineDateKey] || {});
      const hours = (rec.caffeine_hours || []).slice();
      const idx = hours.indexOf(h);
      if (idx >= 0) hours.splice(idx, 1);
      else hours.push(h);
      hours.sort((a, b) => a - b);
      rec.caffeine_hours = hours;
      records[caffeineDateKey] = rec;
      saveRecords(records);
      renderCaffeineGrid();
    }

    // ---- 一覧・詳細 ----
    function sleepDurationText(rec) {
      if (!rec.bedtime || !rec.wake_at) return "-";
      const ms = new Date(rec.wake_at) - new Date(rec.bedtime);
      if (ms <= 0) return "-";
      const totalMin = Math.round(ms / 60000);
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return h + "時間" + m + "分";
    }

    function openListScreen() {
      const records = loadRecords();
      const dates = Object.keys(records).sort().reverse();
      const root = document.getElementById("list-items");
      root.innerHTML = "";

      if (dates.length === 0) {
        root.innerHTML = '<p class="empty-msg">まだ記録がありません</p>';
      }

      dates.forEach(dateStr => {
        const rec = records[dateStr];
        const bed = rec.bedtime ? timeStr(new Date(rec.bedtime)) : "--:--";
        const wake = rec.wake_at ? timeStr(new Date(rec.wake_at)) : "--:--";
        const duration = sleepDurationText(rec);

        const awakeningCount = (rec.awakenings || []).length;
        const subParts = [];
        if (rec.refreshed) subParts.push("すっきり度 " + rec.refreshed + " / 5");
        if (awakeningCount > 0) subParts.push("中途覚醒 " + awakeningCount + "回");

        const item = document.createElement("button");
        item.type = "button";
        item.className = "list-item";
        item.innerHTML =
          '<span class="list-date">' + dateStr + "</span>" +
          '<span class="list-summary">就寝 ' + bed + " → 起床 " + wake + " (" + duration + ")</span>" +
          '<span class="list-refreshed">' + subParts.join(" / ") + "</span>";
        item.onclick = () => openDetailScreen(dateStr);
        root.appendChild(item);
      });

      showScreen("screen-list");
    }

    function formatTimeOrNone(v) {
      if (v == null) return "未入力";
      if (v === "none") return "なし";
      return v;
    }

    function formatRating(v) {
      return v == null ? "未入力" : v + " / 5";
    }

    let detailDateKey = "";

    function openDetailScreen(dateStr) {
      detailDateKey = dateStr;
      renderDetailScreen();
      showScreen("screen-detail");
    }

    function renderDetailScreen() {
      const records = loadRecords();
      const rec = records[detailDateKey] || {};

      document.getElementById("detail-date-label").textContent = detailDateKey;

      const root = document.getElementById("detail-fields");
      root.innerHTML = "";

      const rows = [
        ["就寝時刻", rec.bedtime ? timeStr(new Date(rec.bedtime)) : "未入力"],
        ["起床時刻", rec.wake_at ? timeStr(new Date(rec.wake_at)) : "未入力"],
        ["睡眠時間", sleepDurationText(rec)],
        ["就寝場所", rec.sleep_place ? PLACE_LABELS[rec.sleep_place] : "未入力"],
        ["外出時刻(前日)", formatTimeOrNone(rec.leave_home_at)],
        ["帰宅時刻(前日)", formatTimeOrNone(rec.return_home_at)],
        ["飲酒", rec.alcohol_level ? ALCOHOL_LABELS[rec.alcohol_level] : "未入力"],
        ["最後に飲んだ時刻", formatTimeOrNone(rec.alcohol_last_at)],
        ["カフェイン摂取", (rec.caffeine_hours && rec.caffeine_hours.length) ? rec.caffeine_hours.map(h => h + "時").join("、") : "未入力"],
        ["すっきり度", formatRating(rec.refreshed)],
      ];

      rows.forEach(([k, v]) => {
        const row = document.createElement("div");
        row.className = "detail-row";
        row.innerHTML = '<span class="k">' + k + '</span><span class="v">' + v + "</span>";
        root.appendChild(row);
      });

      // 中途覚醒: 一覧+個別削除+手動追加
      const awakenings = rec.awakenings || [];

      const awLabel = document.createElement("div");
      awLabel.className = "field-label";
      awLabel.style.marginTop = "18px";
      awLabel.textContent = "中途覚醒 (" + awakenings.length + "回)";
      root.appendChild(awLabel);

      awakenings.forEach((aw, i) => {
        const row = document.createElement("div");
        row.className = "awakening-row";
        const time = document.createElement("span");
        time.className = "awakening-time";
        time.textContent = timeStr(new Date(aw.at));
        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "clear-btn";
        removeBtn.textContent = "×";
        removeBtn.onclick = () => removeAwakening(i);
        row.appendChild(time);
        row.appendChild(removeBtn);
        root.appendChild(row);
      });

      const addRow = document.createElement("div");
      addRow.className = "awakening-add";
      const addInput = document.createElement("input");
      addInput.type = "time";
      addInput.step = 1800;
      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "seg-btn";
      addBtn.style.flex = "0 0 auto";
      addBtn.textContent = "追加";
      addBtn.onclick = () => {
        if (!addInput.value) return;
        addAwakening(addInput.value);
      };
      addRow.appendChild(addInput);
      addRow.appendChild(addBtn);
      root.appendChild(addRow);
    }

    // 手動追加は時刻のみ選ぶので、この記録の起床予定日を基準に
    // 「夜(正午以降)の時刻ならその前日、それ以外はその日」の日付を補って保存する。
    function combineDateAndTime(dateKeyStr, timeValue) {
      const [h, m] = timeValue.split(":").map(Number);
      const [y, mo, d] = dateKeyStr.split("-").map(Number);
      const dt = new Date(y, mo - 1, d, h, m, 0, 0);
      if (h >= 12) dt.setDate(dt.getDate() - 1);
      return dt.toISOString();
    }

    function addAwakening(timeValue) {
      const records = loadRecords();
      const rec = Object.assign({}, records[detailDateKey] || {});
      const awakenings = (rec.awakenings || []).slice();
      awakenings.push({ at: combineDateAndTime(detailDateKey, timeValue) });
      awakenings.sort((a, b) => new Date(a.at) - new Date(b.at));
      rec.awakenings = awakenings;
      records[detailDateKey] = rec;
      saveRecords(records);
      renderDetailScreen();
    }

    function removeAwakening(index) {
      const records = loadRecords();
      const rec = Object.assign({}, records[detailDateKey] || {});
      const awakenings = (rec.awakenings || []).slice();
      awakenings.splice(index, 1);
      rec.awakenings = awakenings;
      records[detailDateKey] = rec;
      saveRecords(records);
      renderDetailScreen();
    }

    function deleteDetailRecord() {
      if (!confirm(detailDateKey + " の記録を削除しますか？")) return;
      const records = loadRecords();
      delete records[detailDateKey];
      saveRecords(records);
      openListScreen();
    }
  </script>

</body>
</html>
