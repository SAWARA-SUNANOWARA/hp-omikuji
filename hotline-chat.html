<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f5f0e8;
      font-family: "Helvetica Neue", "Yu Gothic", "YuGothic", sans-serif;
      color: #333;
    }

    /* ---- チャット画面 ---- */
    #chat {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      height: 100vh;
    }

    header {
      padding: 1em;
      text-align: center;
      border-bottom: 1px solid #e5ddd0;
      background: #f5f0e8;
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: #666;
    }

    header button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    header button:hover { color: #666; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1em;
      display: flex;
      flex-direction: column;
      gap: 0.6em;
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }

    .bubble-row.mine {
      align-self: flex-end;
      align-items: flex-end;
    }

    .bubble-row.theirs {
      align-self: flex-start;
      align-items: flex-start;
    }

    .author {
      font-size: 0.65rem;
      color: #aaa;
      margin-bottom: 0.2em;
      letter-spacing: 0.05em;
    }

    .bubble {
      padding: 0.6em 0.9em;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .mine .bubble {
      background: #c4a8e0;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .theirs .bubble {
      background: #fff;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .timestamp {
      font-size: 0.6rem;
      color: #bbb;
      margin-top: 0.2em;
    }

    #empty {
      margin: auto;
      color: #bbb;
      font-size: 0.8rem;
      text-align: center;
    }

    form#composer {
      display: flex;
      gap: 0.5em;
      padding: 0.8em;
      border-top: 1px solid #e5ddd0;
      background: #f5f0e8;
    }

    form#composer textarea {
      flex: 1;
      resize: none;
      font-size: 0.9rem;
      font-family: inherit;
      padding: 0.7em 0.9em;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      max-height: 6em;
    }

    form#composer textarea:focus {
      border-color: #c4a8e0;
    }

    form#composer button {
      border: none;
      border-radius: 10px;
      background: #7ecec1;
      color: #fff;
      padding: 0 1.2em;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    form#composer button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>

  <!-- チャット画面 -->
  <div id="chat">
    <header>
      <span style="width:3em"></span>
      <h1>HOTLINE</h1>
      <button id="refreshBtn">更新</button>
    </header>
    <div id="messages"><p id="empty">まだメッセージはありません</p></div>
    <form id="composer">
      <textarea id="messageInput" placeholder="メッセージを入力" rows="1" maxlength="1000"></textarea>
      <button type="submit" id="sendBtn">送信</button>
    </form>
  </div>

  <script src="hotline-data.js"></script>
  <script>
    // なぞった文字(fortune.html側の判定)と表示名の対応。
    // ここを直接開いても合言葉や名前の入力欄は出さず、
    // 有効なセッションが無ければ黙ってfortune.htmlに戻す。
    const IDENTITY_NAMES = { sawara: "サワラ", hiiragi: "ヒイラギ" };

    let hotlineKey = "";
    let myName = "";
    let pollTimer = null;

    function init() {
      const params = new URLSearchParams(location.search);
      const urlKey = params.get("key");
      const urlAs = params.get("as");

      if (urlKey && IDENTITY_NAMES[urlAs]) {
        saveHotlineKey(urlKey);
        saveHotlineIdentity(urlAs);
        // アドレスバーに合言葉を残さない
        history.replaceState(null, "", location.pathname);
      }

      hotlineKey = getHotlineKey();
      const identity = getHotlineIdentity();
      myName = IDENTITY_NAMES[identity] || "";

      if (hotlineKey && myName) {
        showChat();
      } else {
        // 有効なセッションが無い(=タブを閉じて蓋がされた状態、または
        // ジェスチャーの判定ミス)。何も表示せず、ダミーのおみくじ画面に
        // 戻す。合言葉(?key=...)は付いていればそのまま引き継ぎ、
        // 再度なぞればやり直せるようにする。
        location.replace("fortune.html" + location.search);
      }
    }

    function showChat() {
      document.getElementById("chat").style.display = "flex";
      loadMessages();
      // タブを開いている間だけ定期的に取りに行く(プッシュ通知は一切使わない)
      pollTimer = setInterval(loadMessages, 15000);
      window.addEventListener("beforeunload", () => clearInterval(pollTimer));
    }

    async function loadMessages() {
      try {
        const data = await fetchHotlineMessages(hotlineKey);
        if (data.error) {
          renderError(data.error);
          return;
        }
        renderMessages(data.messages || []);
      } catch (err) {
        renderError("network");
      }
    }

    function renderError(kind) {
      const box = document.getElementById("messages");
      const msg = kind === "unauthorized"
        ? "合言葉が正しくありません。共有されたリンクから開き直してください。"
        : "通信に失敗しました。";
      box.innerHTML = `<p id="empty">${msg}</p>`;
    }

    function renderMessages(messages) {
      const box = document.getElementById("messages");
      if (messages.length === 0) {
        box.innerHTML = '<p id="empty">まだメッセージはありません</p>';
        return;
      }
      const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;

      box.innerHTML = "";
      for (const m of messages) {
        const row = document.createElement("div");
        row.className = "bubble-row " + (m.author === myName ? "mine" : "theirs");

        if (m.author !== myName) {
          const author = document.createElement("div");
          author.className = "author";
          author.textContent = m.author;
          row.appendChild(author);
        }

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = m.message;
        row.appendChild(bubble);

        const time = document.createElement("div");
        time.className = "timestamp";
        time.textContent = formatTime(m.timestamp);
        row.appendChild(time);

        box.appendChild(row);
      }

      if (wasNearBottom) {
        box.scrollTop = box.scrollHeight;
      }
    }

    function formatTime(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      return d.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    document.getElementById("refreshBtn").addEventListener("click", loadMessages);

    document.getElementById("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text) return;
      const sendBtn = document.getElementById("sendBtn");
      sendBtn.disabled = true;
      try {
        const result = await postHotlineMessage(hotlineKey, myName, text);
        if (result.error) {
          renderError(result.error);
        } else {
          input.value = "";
          await loadMessages();
          document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
        }
      } catch (err) {
        renderError("network");
      } finally {
        sendBtn.disabled = false;
      }
    });

    // Enterで送信、Shift+Enterで改行
    document.getElementById("messageInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.getElementById("composer").requestSubmit();
      }
    });

    init();
  </script>

</body>
</html>
